<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FACETTES</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=space-grotesk@500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  </head>
  <body>
    <!-- Animated tile field (always running) -->
    <div id="tileBackground"></div>

    <div class="landing-container">
      <div class="landing-brand">
        <div class="brand-mark">FACETTES</div>
        <p class="brand-byline">By Axel Garland</p>
      </div>
      <button type="button" class="cta-create" id="newFacetteBtn">Create a facette</button>
    </div>

    <div id="maskApp" class="picker-app hidden">
      <div class="picker-top">
        <div class="brand-mark">FACETTES</div>
        <button type="button" id="backToHomeBtn" class="picker-close" aria-label="Back to home">
          <svg width="32" height="32" viewBox="0 0 38 38" fill="none" aria-hidden="true">
            <path d="M10 10L28 28M28 10L10 28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="reveal-stage">
        <div class="reveal-portrait" id="revealPortrait">
          <div id="maskCanvas"></div>
        </div>
        <div class="reveal-copy">
          <p id="personalityBlurb" class="personality-blurb"></p>
          <div class="name-section">
            <input type="text" id="maskNameInput" placeholder="GIVE IT A NAME" maxlength="32" autocomplete="off" />
            <button type="button" id="saveMaskBtn" class="btn">Save</button>
          </div>
          <div class="reveal-actions">
            <button type="button" id="downloadButton" class="btn download-facette" disabled>Download</button>
            <button type="button" id="shareButton" class="btn share-facette" disabled>Share</button>
            <button type="button" id="drawAnotherBtn" class="btn draw-another">Draw another</button>
          </div>
        </div>
      </div>
    </div>

    <div id="galleryOverlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:2000; align-items:flex-start; justify-content:center; overflow:auto;">
      <div style="width:100vw; max-width:1200px; margin:60px auto 0 auto; background:transparent;">
        <div id="galleryHeader" style="display:flex; align-items:center; position:sticky; top:0; z-index:10; background:transparent; height:auto; border:none; box-shadow:none; padding-top:24px; padding-bottom:0;">
          <button id="backToLandingBtn" style="background:none; border:none; cursor:pointer; margin-left:24px; margin-right:18px;">
            <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 30L14 19L24 8" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="gallery-section" style="background:transparent; margin-top:0;">
          <div id="galleryGrid" class="gallery-grid"></div>
        </div>
      </div>
    </div>

    <div id="galleryModal" class="modal hidden">
      <div class="modal-content">
        <button class="modal-close" id="closeGallery">&times;</button>
        <h2>Gallery</h2>
        <div id="galleryModalContent"></div>
      </div>
    </div>

    <div id="saveImageOverlay" class="save-overlay hidden">
      <button type="button" class="save-overlay-close" id="closeSaveOverlay" aria-label="Close">
        <svg width="32" height="32" viewBox="0 0 38 38" fill="none" aria-hidden="true">
          <path d="M10 10L28 28M28 10L10 28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <p class="save-overlay-hint">Hold the image to save it</p>
      <img id="saveOverlayImage" alt="Facette">
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
